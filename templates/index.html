<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Term Deposit Prediction</title>
  <style>
      body {
          font-family: Arial, sans-serif;
          background-color: #f4f7f6;
          padding: 20px;
      }
      .container {
          max-width: 600px;
          margin: auto;
          background: #fff;
          padding: 30px;
          border-radius: 8px;
          box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      h2 {
          text-align: center;
          color: #333;
      }
      .form-group {
          margin-bottom: 15px;
      }
      label {
          display: block;
          margin-bottom: 5px;
          color: #666;
      }
      input[type="text"], input[type="number"], select {
          width: 100%;
          padding: 10px;
          border: 1px solid #ddd;
          border-radius: 4px;
          box-sizing: border-box;
      }
      button {
          width: 100%;
          padding: 10px;
          background-color: #28a745;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          font-size: 16px;
      }
      button:hover {
          background-color: #218838;
      }
      .result {
          text-align: center;
          margin-top: 20px;
          font-size: 20px;
          color: #007bff;
      }
  </style>
</head>
<body>
  <div class="container">
      <h2>Predict Customer Subscription</h2>
      <form action="/predict" method="post">
        
        <div class="form-group">
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required value="30">
        </div>
        
        <div class="form-group">
            <label for="job">Job:</label>
            <select id="job" name="job">
              <option value="admin.">Admin</option>
              <option value="blue-collar">Blue-collar</option>
              <option value="technician">Technician</option>
              <option value="services">Services</option>
              <option value="management">Management</option>
              <option value="retired">Retired</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="marital">Marital Status:</label>
            <select id="marital" name="marital">
              <option value="married">Married</option>
              <option value="single">Single</option>
              <option value="divorced">Divorced</option>
            </select>
        </div>

        <div class="form-group">
            <label for="duration">Last Contact Duration (seconds):</label>
            <input type="number" id="duration" name="duration" required value="200">
        </div>

        <!-- Added some placeholders for other fields; simplified for demonstration -->
        <p style="font-size: 12px; color: #888;">Note: This is a simplified form for demonstration. Production systems would collect all required features.</p>
        
        <button type="submit">Predict</button>
      </form>
      
      {% if prediction_text %}
      <div class="result">
          <h3>{{ prediction_text }}</h3>
      </div>
      {% endif %}
  </div>
</body>
</html>
